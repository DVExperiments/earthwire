name: Keep scheduled updates alive

# GitHub pauses scheduled workflows in repositories with no activity for 60 days.
# This adds an empty commit once a month so the news keeps updating on its own.

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Commit if the repository has been quiet for 40+ days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled news updates active"
            git push
          else
            echo "Recent activity found; nothing to do."
          fi
